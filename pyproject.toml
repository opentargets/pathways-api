[project]
name = "pathways-api"
version = "0.1.0"
description = "FastAPI service for pathway analysis (GSEA) for Open Targets"
authors = [{ name = "Open Targets", email = "contact@opentargets.org" }]
readme = "README.md"


requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "uvicorn>=0.32.0",
    "blitzgsea>=1.3.54",
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    "google-cloud-storage>=3.4.1",
    "pyarrow>=22.0.0",
    "gcsfs>=2025.9.0",
    "polars>=1.40.1",
    "yappi>=1.7.6",
    "duckdb>=1.5.3",
    "loguru>=0.7.3",
    "click>=8.3.1",
]

[dependency-groups]
dev = [
    "memray>=1.19.3",
    "py-spy>=0.4.2",
    "gprof2dot>=2025.4.14",
    "ty>=0.0.42",
]
lint = ["ruff>=0.7.1"]
